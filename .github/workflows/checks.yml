name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  ports:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt Pillow==13.0.0
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/poketch.test.mjs
      - if: runner.os == 'Linux'
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1
          npx playwright install --with-deps chromium
          node tests/poketch-browser.mjs
