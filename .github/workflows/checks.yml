name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  ports:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth weston libgl1 libegl1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 \
            libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxkbcommon-x11-0
      - run: python -m pip install -r requirements.txt Pillow==13.0.0
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb SINNOH_TEST_X11=1 python -m unittest discover -s tests -p test_panel.py -v
      - if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_SESSION_TYPE=wayland WAYLAND_DISPLAY=wayland-sinnoh
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 > /tmp/sinnoh-weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then
              break
            fi
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || { cat /tmp/sinnoh-weston.log; exit 1; }
          env QT_QPA_PLATFORM=wayland SINNOH_TEST_WAYLAND=1 python -m unittest discover -s tests -p test_panel.py -v
